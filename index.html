<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw GitHub teszt</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6f8;
      color: #1c1e21;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 56px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 480px;
    }
    h1 { font-size: 1.9rem; margin: 0 0 12px; }
    p { font-size: 1.05rem; color: #555; margin: 0; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1e21; }
      .card { background: #282a2d; color: #f5f6f8; }
      p { color: #bbb; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>OpenClaw GitHub teszt</h1>
    <p>Ez a weboldal automatikusan készült az OpenClaw segítségével, és GitHub Pages-re lett publikálva.</p>
  </main>
</body>
</html>
